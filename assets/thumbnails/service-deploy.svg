<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="무중단 배포 모듈 정리 썸네일">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2a44"/>
      <stop offset="100%" stop-color="#0d3b3e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- traffic bars: 10% → 50% → 100% -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12" fill="#cfe7e4">
    <rect x="40" y="40" width="320" height="14" rx="7" fill="#2c3d5c"/>
    <rect x="40" y="40" width="32" height="14" rx="7" fill="#f2b134"/>
    <text x="40" y="72">10%</text>

    <rect x="40" y="86" width="320" height="14" rx="7" fill="#2c3d5c"/>
    <rect x="40" y="86" width="160" height="14" rx="7" fill="#f2b134"/>
    <text x="40" y="118">50%</text>

    <rect x="40" y="132" width="320" height="14" rx="7" fill="#5fd0c8"/>
    <text x="40" y="164">100%</text>
  </g>

  <text x="30" y="204" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="22" fill="#ffffff" font-weight="700">문 닫지 않고 메뉴 바꾸기</text>
</svg>
