<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Malgun Gothic',sans-serif">
  <rect width="900" height="520" fill="#faf9f6"/>

  <!-- Signal -->
  <rect x="360" y="20" width="180" height="56" rx="12" fill="#ffffff" stroke="#c9c4b6" stroke-width="1.5"/>
  <text x="450" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2a27">매매 신호 발생</text>

  <path d="M450 76 L450 108" stroke="#a39c88" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- AI judge -->
  <rect x="330" y="110" width="240" height="60" rx="12" fill="#f2c9a8" stroke="#dba872" stroke-width="1.5"/>
  <text x="450" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#7a3a22">AI 판정 (classify)</text>

  <path d="M450 170 L450 202" stroke="#a39c88" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- decision diamond -->
  <polygon points="450,204 560,254 450,304 340,254" fill="#ece6d6" stroke="#c7bd9e" stroke-width="1.5"/>
  <text x="450" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#5c5640">3가지 위험 기준에</text>
  <text x="450" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#5c5640">해당하나?</text>

  <!-- No branch: left -->
  <path d="M340 254 L150 254" stroke="#a39c88" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="245" y="240" text-anchor="middle" font-size="13" fill="#3f5c2c" font-weight="700">아니오</text>
  <rect x="30" y="226" width="200" height="56" rx="12" fill="#cbe3b8" stroke="#a0c987" stroke-width="1.5"/>
  <text x="130" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#3f5c2c">자동 실행</text>
  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#3f5c2c">(검증된 반복 규칙)</text>

  <!-- Yes branch: down -->
  <path d="M450 304 L450 336" stroke="#a39c88" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="470" y="326" font-size="13" fill="#a03a2a" font-weight="700">예</text>

  <!-- interrupt node -->
  <rect x="310" y="338" width="280" height="66" rx="12" fill="#eb9a86" stroke="#d97552" stroke-width="1.5"/>
  <text x="450" y="366" text-anchor="middle" font-size="15" font-weight="800" fill="#7a3a22">interrupt() — 사람 대기</text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="#7a3a22">되돌릴 수 없는 결정 앞에서 멈춤</text>

  <path d="M450 404 L450 434" stroke="#a39c88" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 4 human responses -->
  <rect x="60" y="436" width="150" height="56" rx="10" fill="#ffffff" stroke="#c9c4b6" stroke-width="1.5"/>
  <text x="135" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">승인</text>

  <rect x="240" y="436" width="150" height="56" rx="10" fill="#ffffff" stroke="#c9c4b6" stroke-width="1.5"/>
  <text x="315" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">수정 후</text>
  <text x="315" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">승인</text>

  <rect x="420" y="436" width="150" height="56" rx="10" fill="#ffffff" stroke="#c9c4b6" stroke-width="1.5"/>
  <text x="495" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">반려</text>

  <rect x="600" y="436" width="150" height="56" rx="10" fill="#ffffff" stroke="#c9c4b6" stroke-width="1.5"/>
  <text x="675" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2a27">다시 판정</text>

  <path d="M135 434 L370 404" stroke="#a39c88" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M315 434 L410 404" stroke="#a39c88" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M495 434 L480 404" stroke="#a39c88" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M675 434 L540 404" stroke="#a39c88" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="675" y="510" text-anchor="middle" font-size="11" fill="#8a5a2a">"다시 판정"은 AI 판정 단계로 되돌아감(Command(resume=...))</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a39c88"/>
    </marker>
  </defs>
</svg>
